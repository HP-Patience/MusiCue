<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Claudio listening loop</title>
  <desc id="desc">Claudio understands a conversational request, reads the listening context, finds and plays music, then turns listening history into taste insight.</desc>
  <rect width="1200" height="470" rx="24" fill="#f5f0e8"/>
  <text x="56" y="62" fill="#191411" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="32" font-weight="700">Say it once. Let the music take shape.</text>
  <text x="56" y="94" fill="#76695f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">INTENT → CONTEXT → PLAYBACK → MEMORY</text>

  <g transform="translate(40 138)">
    <rect width="250" height="214" rx="14" fill="#fffaf4" stroke="#d5c8ba" stroke-width="2"/>
    <circle cx="28" cy="32" r="8" fill="#e76f51"/>
    <text x="48" y="39" fill="#191411" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">01 / SAY</text>
    <text x="24" y="82" fill="#191411" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="23" font-weight="600">Your words</text>
    <text x="24" y="119" fill="#76695f" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="17">“Something gentle for</text>
    <text x="24" y="146" fill="#76695f" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="17">a rainy evening.”</text>
    <path d="M24 182H170" stroke="#e76f51" stroke-width="3"/>
  </g>

  <path d="M306 245H334" stroke="#d4a373" stroke-width="3"/>
  <path d="M324 235L336 245L324 255" fill="none" stroke="#d4a373" stroke-width="3"/>

  <g transform="translate(350 138)">
    <rect width="250" height="214" rx="14" fill="#fffaf4" stroke="#d5c8ba" stroke-width="2"/>
    <circle cx="28" cy="32" r="8" fill="#d4a373"/>
    <text x="48" y="39" fill="#191411" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">02 / READ</text>
    <text x="24" y="82" fill="#191411" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="23" font-weight="600">The moment</text>
    <text x="24" y="119" fill="#76695f" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="17">mood, weather, time,</text>
    <text x="24" y="146" fill="#76695f" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="17">calendar, taste, history</text>
    <path d="M24 182H170" stroke="#d4a373" stroke-width="3"/>
  </g>

  <path d="M616 245H644" stroke="#d4a373" stroke-width="3"/>
  <path d="M634 235L646 245L634 255" fill="none" stroke="#d4a373" stroke-width="3"/>

  <g transform="translate(660 138)">
    <rect width="250" height="214" rx="14" fill="#191411" stroke="#3b3028" stroke-width="2"/>
    <circle cx="28" cy="32" r="8" fill="#1e9e78"/>
    <text x="48" y="39" fill="#f5f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">03 / CUE</text>
    <text x="24" y="82" fill="#f5f0e8" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="23" font-weight="600">The right sound</text>
    <text x="24" y="119" fill="#b7aaa0" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="17">search → queue → play</text>
    <text x="24" y="146" fill="#d4a373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">say / play / segue</text>
    <path d="M24 182H170" stroke="#1e9e78" stroke-width="3"/>
  </g>

  <path d="M926 245H954" stroke="#d4a373" stroke-width="3"/>
  <path d="M944 235L956 245L944 255" fill="none" stroke="#d4a373" stroke-width="3"/>

  <g transform="translate(970 138)">
    <rect width="190" height="214" rx="14" fill="#fffaf4" stroke="#d5c8ba" stroke-width="2"/>
    <circle cx="28" cy="32" r="8" fill="#e76f51"/>
    <text x="48" y="39" fill="#191411" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">04 / LEARN</text>
    <text x="24" y="82" fill="#191411" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="23" font-weight="600">Your taste</text>
    <text x="24" y="119" fill="#76695f" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="17">plays → stats →</text>
    <text x="24" y="146" fill="#76695f" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="17">LLM report</text>
    <path d="M24 182H140" stroke="#e76f51" stroke-width="3"/>
  </g>

  <text x="56" y="414" fill="#76695f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">LOCAL CONTEXT / MUSIC SEARCH / GRADUAL MOOD ARC / LISTENING REPORT</text>
</svg>
